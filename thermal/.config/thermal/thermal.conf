# 🌡️  Thermal / power tuning — MSI Katana GF66 12UC (MS-1584)
# =============================================================
# Edit, then apply with:   make thermal-reload      (or: sudo systemctl restart thermal)
# Inspect current state:   make thermal-status
#
# Why this file exists
# --------------------
# Caps sustained CPU power below the chip's 45W rating, trading a little peak
# throughput for a real drop in steady-state temperature. Cooler boost only
# moves heat that already exists; this reduces how much gets made.
#
# Every value here is a plain sysfs write. Nothing is permanent; a reboot with
# the service disabled restores BIOS defaults.


# ─── CPU power limits ────────────────────────────────────────────────────────
# PL1 = sustained ceiling. This is THE setting that controls your temperature.
# PL2 = short burst ceiling (~28s), keeps the UI and compiles snappy.
#
# Measured on this machine, all-core load, ~25°C ambient:
#
#   PL1   Draw    Temp   Fan   Clock      Notes
#   ----  ------  -----  ----  ---------  ------------------------------------
#   28    ~28W    ~70°C  low   ~2.0GHz    Estimated. Try if 35 isn't enough.
#   35    35.2W   77°C   60%   2269MHz    ← measured. Current setting.
#   45    45.3W   86°C   70%   2575MHz    ← measured. BIOS default behaviour.
#
# NOTE: BIOS default reads as PL1=200W, but measured draw is 45.3W — the EC
# enforces the real 45W design point anyway. So 200 is not "unlimited" in
# practice, and this file is a deliberate choice to run cooler than spec, not
# a fix for a broken setting. See README.md.
#
# Set 0 to skip writing a limit and leave the BIOS value alone.
PL1_WATTS=35
PL2_WATTS=45

# How long PL2 may be sustained before PL1 clamps down, in seconds.
# Longer = burstier feel but more heat spikes. 0 = leave firmware default.
PL1_TIME_WINDOW_SEC=28


# ─── CPU frequency governor behaviour ────────────────────────────────────────
# EPP tells intel_pstate how eagerly to chase peak clocks. Your workload is
# bursty (agents, node, dart compiles), and the top ~400MHz of boost costs
# disproportionate heat for very little wall-clock. balance_power trims that.
#
# Options: default | performance | balance_performance | balance_power | power
# Empty = don't touch.
EPP=balance_power

# Options: powersave | performance   (intel_pstate: powersave is the sane one,
# it still reaches max clocks — it just isn't pinned there.) Empty = don't touch.
GOVERNOR=powersave


# ─── MSI embedded controller (via msi-ec kernel module) ──────────────────────
# These map to /sys/devices/platform/msi-ec/. This is the modern replacement
# for `isw`, which has no profile for this board — see README.md.

# Options: eco | comfort | turbo    — MSI's own performance envelope.
# Empty = don't touch.
SHIFT_MODE=comfort

# Options: auto | silent | advanced — EC fan curve selection.
# `auto` is correct once PL1 is capped; the curve no longer gets pushed hard.
# Empty = don't touch.
FAN_MODE=auto

# Options: on | off — the Fn+Up toggle, scripted. Leave `off`: with PL1 capped
# you shouldn't need it, and it's the loudest thing this laptop can do.
# Empty = don't touch.
COOLER_BOOST=off
