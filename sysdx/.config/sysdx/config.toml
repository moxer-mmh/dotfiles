# sysdx config — Generated by theme system, do not edit manually

[display]
journal_lines    = 60
tick_rate_ms     = 250
show_description = true
list_width_pct   = 38
date_format      = "%H:%M:%S"

[keybinds]
move_down    = "j"
move_up      = "k"
page_down    = "ctrl-d"
page_up      = "ctrl-u"
go_top       = "g"
go_bottom    = "G"
filter       = "/"
action_menu  = "enter"
switch_scope = "tab"
open_logs    = "l"
quit         = "q"

[colors]
background     = "#1a1a2e"
surface        = "#1e1e2e"
border         = "#8844ff"
border_focused = "#00ff88"
text           = "#e0e1e5"
text_dim       = "#b4a7d6"
selection_bg   = "#2a2a40"
selection_fg   = "#e0e1e5"
active         = "#00ff88"
inactive       = "#b4a7d6"
failed         = "#ff0088"
filter_bar     = "#ffaa00"
header         = "#8844ff"
