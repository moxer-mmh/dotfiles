# =============================================================
# mpv keybindings — defaults + uosc menus + small ergonomic tweaks
# =============================================================

# ---------- Seek (override defaults to 5s/30s) ----------
RIGHT       seek  5
LEFT        seek -5
Shift+RIGHT seek  1 exact
Shift+LEFT  seek -1 exact
UP          seek  30
DOWN        seek -30

# ---------- Volume (5% steps) ----------
WHEEL_UP    add volume  5
WHEEL_DOWN  add volume -5
9           add volume -5
0           add volume  5

# ---------- Playback ----------
SPACE  cycle pause
p      cycle pause
q      quit
Q      quit-watch-later
f      cycle fullscreen
m      cycle mute
.      frame-step
,      frame-back-step

# ---------- Subtitles ----------
j      cycle sub
J      cycle sub down
z      add sub-delay -0.1
Z      add sub-delay  0.1
v      cycle sub-visibility

# ---------- uosc menus (proximity UI) ----------
TAB        script-binding uosc/toggle-ui
F1         script-binding uosc/menu
MBTN_RIGHT script-binding uosc/menu
o          script-binding uosc/open-file
P          script-binding uosc/playlist
S          script-binding uosc/subtitles
A          script-binding uosc/audio
C          script-binding uosc/chapters
