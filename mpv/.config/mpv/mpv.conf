# =============================================================
# mpv config — PipeWire audio + uosc UI + GPU-next quality
#
# Theme colors live in `colors.conf`, generated by apply-theme.sh from
# theme/.config/theme/templates/mpv-colors.conf.tpl. Everything in THIS
# file is hand-maintained and palette-independent.
#
# NOTE: profiles must stay at the bottom — in mpv config syntax every
# option after a `[section]` header belongs to that profile.
# =============================================================

include=~~/colors.conf

# ---------- Audio (fixes "no sound" on PipeWire systems) ----------
ao=pipewire
audio-channels=auto-safe
volume=100
volume-max=150
audio-file-auto=fuzzy
# Load cover.jpg / folder.png sitting next to the track, for files that
# have no embedded art. `fuzzy` accepts loose filename matches.
cover-art-auto=fuzzy

# ---------- Video / quality ----------
vo=gpu-next
hwdec=auto-safe
profile=high-quality
scale=ewa_lanczossharp
cscale=ewa_lanczos
dscale=mitchell
deband=yes
interpolation=yes
video-sync=display-resample

# ---------- UI (let uosc take over) ----------
# mpv-uosc on Arch installs to /usr/share/mpv/scripts/ which mpv does NOT
# autoscan (only ~/.config/mpv/scripts/ and /etc/mpv/scripts/ are scanned).
# Force-load it from the package path so uosc actually runs.
# (thumbfast ships to /etc/mpv/scripts/ and IS autoscanned — nothing needed.)
scripts-append=/usr/share/mpv/scripts/uosc
# uosc draws its icons as ligatures, asking libass for the font
# `MaterialIconsRound-Regular` (see uosc/lib/ass.lua). The Arch package ships
# that font to /usr/share/mpv/fonts/uosc_icons.otf — a directory fontconfig
# does NOT scan — so the lookup silently resolves to whatever monospace font
# fontconfig picks instead, and every icon renders as its literal ligature
# name ("play_arrow", "list_menu", ...).
#
# Fix: keep our own copies in `fonts/` beside this file, which is libass's
# default scan dir (`--sub-fonts-dir` defaults to `~~/fonts`). Committing the
# fonts also makes this module self-contained on a machine where the mpv-uosc
# package layout differs.
osc=no
osd-bar=no
border=no
# uosc reads osd-font for its own labels. Proportional UI face, not the
# terminal's FiraCode — Noto Sans covers the Arabic in the chaabi library.
osd-font="Adwaita Sans"
osd-font-size=30

# ---------- Subtitles ----------
# Deliberately not themed: white fill + black outline stays readable on any
# footage, which a palette accent does not.
sub-auto=fuzzy
sub-font="Noto Sans"
sub-font-size=40
sub-bold=yes
sub-color="#FFFFFFFF"
sub-border-color="#FF000000"
sub-border-size=2.6
# Outline alone is cleaner than outline + drop shadow.
sub-shadow-offset=0
sub-margin-y=40
slang=en,eng,ar,ara
alang=ja,jpn,en,eng

# ---------- Behavior ----------
save-position-on-quit=yes
keep-open=yes
# Slightly longer than 1s so the UI doesn't flicker away mid-reach.
cursor-autohide=1500
force-seekable=yes
ytdl-format=bestvideo[height<=?1080]+bestaudio/best

# ---------- Screenshots ----------
screenshot-format=png
screenshot-png-compression=8
screenshot-directory=~/Pictures/mpv

# ---------- Cache (smoother streaming) ----------
cache=yes
demuxer-max-bytes=150MiB
demuxer-max-back-bytes=75MiB


# =============================================================
# Profiles
# =============================================================

# ---------- Audio-only / album-art playback ----------
# Fires when an audio track is playing AND there's either no video track at
# all, or the only "video" track is an attached cover image.
#
# The leading audio-track check matters: without it the condition is also
# true while mpv sits idle with no file open, so the profile thrashes
# apply/restore around every file load. `profile-restore=copy` snapshots the
# previous values so they're put back when you open a real video next.
[audio-only]
profile-cond=get("current-tracks/audio") and (not get("current-tracks/video") or get("current-tracks/video/albumart", false))
profile-restore=copy

# A cover is a still frame. Interpolation, display-resample and the heavy
# EWA scalers cost GPU time and buy exactly nothing here.
interpolation=no
video-sync=audio
scale=spline36
cscale=spline36
deband=no

# Fill the window with a blurred, scaled-up copy of the cover instead of
# black bars — the art tints its own backdrop. Needs vo=gpu-next.
border-background=blur
background-blur-radius=40

# Always show a window for audio, and reserve room at the bottom so the
# cover sits above uosc's permanently-visible transport bar.
force-window=yes
video-margin-ratio-bottom=0.12
