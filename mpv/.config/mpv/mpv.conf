# =============================================================
# mpv config — PipeWire audio + uosc UI + GPU-next quality
# =============================================================

# ---------- Audio (fixes "no sound" on PipeWire systems) ----------
ao=pipewire
audio-channels=auto-safe
volume=100
volume-max=150
audio-file-auto=fuzzy

# ---------- Video / quality ----------
vo=gpu-next
hwdec=auto-safe
profile=high-quality
scale=ewa_lanczossharp
cscale=ewa_lanczos
dscale=mitchell
deband=yes
interpolation=yes
video-sync=display-resample

# ---------- UI (let uosc take over) ----------
# mpv-uosc on Arch installs to /usr/share/mpv/scripts/ which mpv does NOT
# autoscan (only ~/.config/mpv/scripts/ and /etc/mpv/scripts/ are scanned).
# Force-load it from the package path so uosc actually runs.
scripts-append=/usr/share/mpv/scripts/uosc
osc=no
osd-bar=no
border=no

# ---------- Subtitles ----------
sub-auto=fuzzy
sub-font="Sans"
sub-font-size=40
sub-color="#FFFFFFFF"
sub-border-color="#FF000000"
sub-border-size=2
sub-shadow-offset=1
slang=en,eng,ar,ara
alang=ja,jpn,en,eng

# ---------- Behavior ----------
save-position-on-quit=yes
keep-open=yes
cursor-autohide=1000
force-seekable=yes
ytdl-format=bestvideo[height<=?1080]+bestaudio/best

# ---------- Screenshots ----------
screenshot-format=png
screenshot-png-compression=8
screenshot-directory=~/Pictures/mpv

# ---------- Cache (smoother streaming) ----------
cache=yes
demuxer-max-bytes=150MiB
demuxer-max-back-bytes=75MiB
