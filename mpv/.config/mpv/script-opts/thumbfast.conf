# =============================================================
# thumbfast — seekbar thumbnail previews (consumed by uosc)
#
# This file REPLACES /etc/mpv/script-opts/thumbfast.conf rather than
# merging with it: read_options() takes the first match in mpv's config
# search path, and ~/.config/mpv wins. So every option must be listed.
# =============================================================

# Socket path (leave empty for auto)
socket=

# Thumbnail path (leave empty for auto)
thumbnail=

# Max thumbnail size in pixels. The packaged default of 200 is noticeably
# soft on a 1080p+ display; 320 stays cheap to generate and reads sharp.
max_height=320
max_width=320

# Scale factor for thumbnail display size (requires mpv 0.38+)
# Lower quality than raising max_height/max_width, so leave at 1.
scale_factor=1

# Apply tone-mapping, no to disable
tone_mapping=auto

# Overlay id
overlay_id=42

# Start the thumbnailer at file load so the first hover already has frames
# instead of showing a gap.
spawn_first=yes

# Tear down the helper mpv process after a minute idle rather than holding
# it for the whole session.
quit_after_inactivity=60

# Thumbnails for streams too (YouTube etc). Costs extra bandwidth, which is
# the tradeoff for seek previews on network playback.
network=yes

# Pointless for music: the cover art is one static frame.
audio=no

# Hardware decoding for thumbnail generation. Left off — at 320px the CPU
# path is fast enough and avoids driver-specific decode quirks.
hwdec=no

# Windows only: use native Windows API to write to pipe (requires LuaJIT)
direct_io=no

# Custom path to the mpv executable
mpv_path=mpv
